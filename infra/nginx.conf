# MatchIQ + other sites on ONE host (multi-tenant nginx).
# Frontend lives under /matchiq/ ; /api/* is proxied to the backend container.
# Other sites share the same host on their own prefixes, e.g. /other/.
server {
    listen 80;
    server_name _;

    # --- MatchIQ SPA (served from /matchiq/) --------------------------------
    location /matchiq/ {
        alias /usr/share/nginx/html/matchiq/;
        # SPA fallback: any unknown path inside /matchiq/ serves index.html
        try_files $uri $uri/ /matchiq/index.html;
    }

    # --- Shared API backend (same origin, so frontend fetch("/api/...") works) -
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE live stream: no buffering, long-lived connection.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # --- Example: another site on the same host ------------------------------
    location /other-site/ {
        alias /usr/share/nginx/html/other-site/;
        try_files $uri $uri/ /other-site/index.html;
    }

    # --- Root fallback -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
